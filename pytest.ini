[tool:pytest]
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
minversion = 6.0
addopts = --verbose --tb=short --strict-markers --disable-warnings --color=yes --durations=10
markers =
    unit: Unit tests that test individual components in isolation
    integration: Integration tests that test component interactions
    slow: Tests that take longer than normal to run
    requires_redis: Tests that require Redis to be running
    requires_memgraph: Tests that require Memgraph to be running
    smoke: Basic smoke tests for quick validation
    regression: Regression tests for previously fixed bugs
    real_api: Tests that make real API calls to external services
    real_llm: Tests that require real LLM API calls (subset of real_api)
console_output_style = progress
junit_family = xunit2
asyncio_mode = auto
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:asyncio
log_cli = false
log_cli_level = INFO
log_file_level = DEBUG
empty_parameter_set_mark = xfail